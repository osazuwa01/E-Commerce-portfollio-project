<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/8e452d34db.js" crossorigin="anonymous"></script>
</head>
<body>
   <section id="landing">
    <nav>
        <div class="nav__container">
            <img class="logo" src="/Library.svg" alt="">
            <ul class="nav__links">
                <li><a href="#" class="nav__link">Home</a></li>
                <li><a href="#" class="nav__link">Contact</a></li>
                <li><a href="#" class="nav__link nav__link--primary">Books</a></li>  
            </ul>
        </div>
    </nav>
    <header>
    <div class="header__container">
        <div class="header__description">
            <h1>Finland's most awarded online library platform</h1>
            <h2>Find your dream book with <span class="purple">Library</span></h2>
            <button class="btn">Browse books</button>
        </div>
        <figure class="header__img--wrapper">
            <img src="./Undraw_Books.svg" alt="">
        </figure>
    </div>
    </header>
   </section> 
   <main>
    <section id="highlights">
    <div class="container">
        <div class="row">
        <h2 class="section__title">
            Why choose <span class="purple">Library?</span>
        </h2>
        <div class="highlight__wrapper">
            <div class="highlight">
                <div class="highlight__img">
                    <i class="fas fa-bolt"></i>
                </div>
                    <h3 class="highlight__subtitle">
                            Easy and Quick
                        </p>
                        <p class="highlight__para">
                            Get access to the book you purchased online instantly.
                        </p>
                    </h3>
            </div>
        </div>
        </div>
    </div>
    </section>
   </main>
</body>
</html>
